<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/><title>Test</title></head>
<body style="background:#07101f;color:#f0f6ff;font-family:monospace;padding:20px">
<h2>GridIronScout — System Check</h2>
<div id="out"></div>
<script>
const log = msg => {
  const d = document.createElement("div");
  d.style.margin = "6px 0";
  d.style.padding = "8px 12px";
  d.style.borderRadius = "6px";
  d.style.background = msg.startsWith("✅") ? "#22c55e22" : msg.startsWith("❌") ? "#ef444422" : "#1c2e44";
  d.style.border = `1px solid ${msg.startsWith("✅") ? "#22c55e" : msg.startsWith("❌") ? "#ef4444" : "#3d566e"}`;
  d.textContent = msg;
  document.getElementById("out").appendChild(d);
};

// 1. Check proxy is reachable
log("⏳ Testing /api/cfbd proxy...");
fetch("/api/cfbd?path=/ratings/sp&year=2025")
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(data => {
    if (Array.isArray(data) && data.length > 0) {
      log("✅ Proxy works! SP+ data returned " + data.length + " teams");
    } else {
      log("❌ Proxy responded but data is empty or wrong format: " + JSON.stringify(data).slice(0,200));
    }
  })
  .catch(e => log("❌ Proxy failed: " + e.message));

// 2. Check roster for Alabama
log("⏳ Testing roster for Alabama 2025...");
fetch("/api/cfbd?path=/roster&team=Alabama&year=2025")
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(data => {
    if (Array.isArray(data) && data.length > 0) {
      log("✅ Roster works! Got " + data.length + " players. First player: " + JSON.stringify(data[0]));
    } else {
      log("❌ Roster empty or wrong: " + JSON.stringify(data).slice(0,300));
    }
  })
  .catch(e => log("❌ Roster failed: " + e.message));

// 3. Check if React CDN loads
const s = document.createElement("script");
s.src = "https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js";
s.onload = () => log("✅ React CDN loaded OK");
s.onerror = () => log("❌ React CDN FAILED to load — this would cause a blank page");
document.head.appendChild(s);
</script>
</body>
</html>
