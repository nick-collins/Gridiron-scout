// ── API — calls our own /api/cfbd proxy, key never leaves the server ──────────
async function api(path,params={}){
  const url=new URL("/api/cfbd",window.location.href);
  url.searchParams.set("path",path);
  Object.entries(params).forEach(([k,v])=>{if(v!=null&&v!=="")url.searchParams.set(k,String(v));});
  try{
    const r=await fetch(url.toString());
    if(!r.ok) return null;
    return await r.json();
  }catch{return null;}
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pScore=p=>Math.round((p.stars||0)*15+clamp((p.year||1)-1,0,3)*8+(p.rating?p.rating*20:0));
const f1=n=>isNaN(n)?"—":(Math.round(n*10)/10).toFixed(1);
const winP=(a,b)=>1/(1+Math.exp(-((a||0)-(b||0))/7));

// ── SCHEDULE ──────────────────────────────────────────────────────────────────
function Schedule({games,team,ratings}){
  const rec=(()=>{
    if(!games?.length||!ratings)return null;
    let w=0,l=0;
    games.forEach(g=>{const h=g.home_team===team,opp=h?g.away_team:g.home_team;const p=h?winP(ratings[team]||0,ratings[opp]||0):1-winP(ratings[opp]||0,ratings[team]||0);w+=p;l+=1-p;});
    return{w:f1(w),l:f1(l),n:games.length};
  })();
  if(!games?.length)return <div style={{color:C.muted,textAlign:"center",padding:48,fontSize:14}}>No schedule data loaded.</div>;
  return <div>
    {rec&&<div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap"}}><Badge label="Proj Wins" val={rec.w} color={C.green}/><Badge label="Proj Losses" val={rec.l} color={C.red}/><Badge label="Games" val={rec.n} color={C.blue}/></div>}
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {games.map((g,i)=>{
        const h=g.home_team===team,opp=h?g.away_team:g.home_team;
        const p=h?winP(ratings?.[team]||0,ratings?.[opp]||0):1-winP(ratings?.[opp]||0,ratings?.[team]||0);
        const pct=Math.round(p*100),done=g.home_points!=null;
        const won=done&&(h?g.home_points>g.away_points:g.away_points>g.home_points);
        return <div key={i} style={{display:"flex",alignItems:"center",gap:13,background:C.card,borderRadius:10,padding:"11px 16px",border:`1px solid ${C.border}`}}>
          <div style={{width:36,color:C.dim,fontSize:11,textAlign:"center",flexShrink:0}}>{g.week?`Wk ${g.week}`:`#${i+1}`}</div>
          <div style={{flex:1}}><span style={{color:C.muted,fontSize:11,marginRight:5}}>{h?"vs":"@"}</span><span style={{color:C.text,fontWeight:700,fontSize:14}}>{opp}</span></div>
          {done?<span style={{color:won?C.green:C.red,fontWeight:800,fontSize:13}}>{won?"W":"L"} {h?`${g.home_points}-${g.away_points}`:`${g.away_points}-${g.home_points}`}</span>
          :<div style={{display:"flex",alignItems:"center",gap:7}}><div style={{width:76,height:6,background:C.border,borderRadius:3,overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:pct>60?C.green:pct<40?C.red:C.accent,borderRadius:3}}/></div><span style={{color:C.muted,fontSize:12,width:34,textAlign:"right"}}>{pct}%</span></div>}
        </div>;
      })}
    </div>
  </div>;
}

function Recruiting({commits}){
  const s=[...(commits||[])].sort((a,b)=>(b.stars||0)-(a.stars||0));
  const avg=s.length?(s.reduce((x,r)=>x+(r.stars||0),0)/s.length).toFixed(1):"—";

// ── MATCHUP ───────────────────────────────────────────────────────────────────
function Matchup(){
  const[tA,sTA]=useState(null);const[tB,sTB]=useState(null);
  const[yA,sYA]=useState(String(DATA_YEAR));const[yB,sYB]=useState(String(DATA_YEAR));
  const[neutral,sN]=useState(false);
  const[res,sR]=useState(null);const[load,sL]=useState(false);
  const[hist,sH]=useState(null);const[hLoad,sHL]=useState(false);
  const YRS=Array.from({length:6},(_,i)=>DATA_YEAR-i);
  async function run(){
    if(!tA||!tB)return;
    sL(true);sR(null);sH(null);
    const[sp,rA,rB]=await Promise.all([api("/ratings/sp",{year:Math.max(Number(yA),Number(yB))}),api("/roster",{team:tA.school,year:yA}),api("/roster",{team:tB.school,year:yB})]);
    const m={};(sp||[]).forEach(t=>{m[t.team]={off:t.offense?.rating||0,def:t.defense?.rating||0,sp:(t.offense?.rating||0)+(t.defense?.rating||0)};});
    const spA=m[tA.school]||{off:0,def:0,sp:0},spB=m[tB.school]||{off:0,def:0,sp:0};
    const diff=(spA.sp+(neutral?0:2.5))-spB.sp,pA=1/(1+Math.exp(-diff/7));
    sR({spA,spB,pA,sA:Math.max(7,Math.round(14+spA.off*.4-spB.def*.3)),sB:Math.max(7,Math.round(14+spB.off*.4-spA.def*.3)),rA:rA||[],rB:rB||[]});
    sL(false);sHL(true);
    const g=await api("/games",{team:tA.school,opponent:tB.school});
    sH((g||[]).sort((a,b)=>b.season-a.season).slice(0,10));sHL(false);
  }
  const SR=({lbl,a,b,hb=true})=>{
    const an=parseFloat(a),bn=parseFloat(b);
    const aW=!isNaN(an)&&!isNaN(bn)&&(hb?an>bn:an<bn),bW=!isNaN(an)&&!isNaN(bn)&&(hb?bn>an:bn<an);
    return <div style={{display:"flex",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}18`}}>
      <div style={{flex:1,textAlign:"right",fontWeight:aW?800:400,color:aW?C.green:C.text,fontSize:13}}>{a??"-"}</div>
      <div style={{width:170,textAlign:"center",color:C.muted,fontSize:11,textTransform:"uppercase",letterSpacing:.7,padding:"0 10px"}}>{lbl}</div>
      <div style={{flex:1,textAlign:"left",fontWeight:bW?800:400,color:bW?C.green:C.text,fontSize:13}}>{b??"-"}</div>
    </div>;
  };
  return <div>
    <h3 style={{margin:"0 0 18px",color:C.text,fontWeight:900,fontSize:20}}>⚔️ Matchup Simulator</h3>
    <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:14,alignItems:"center",marginBottom:18}}>
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        <TSearch val={tA} set={sTA} exclude={tB?.school}/>
        <select value={yA} onChange={e=>sYA(e.target.value)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 11px",color:C.text,fontSize:13,outline:"none"}}>{YRS.map(y=><option key={y} value={y}>{y} Season</option>)}</select>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
        <div style={{color:C.accent,fontWeight:900,fontSize:22}}>VS</div>
        <label style={{display:"flex",alignItems:"center",gap:5,color:C.muted,fontSize:12,cursor:"pointer"}}><input type="checkbox" checked={neutral} onChange={e=>sN(e.target.checked)}/> Neutral</label>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        <TSearch val={tB} set={sTB} exclude={tA?.school}/>
        <select value={yB} onChange={e=>sYB(e.target.value)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 11px",color:C.text,fontSize:13,outline:"none"}}>{YRS.map(y=><option key={y} value={y}>{y} Season</option>)}</select>
      </div>
    </div>
    <button onClick={run} disabled={!tA||!tB||load} style={{width:"100%",background:C.accent,color:"#000",border:"none",borderRadius:10,padding:12,fontWeight:900,fontSize:15,cursor:tA&&tB?"pointer":"not-allowed",opacity:tA&&tB?1:.45,marginBottom:22}}>{load?"Simulating…":"⚡ Run Simulation"}</button>
    {load&&<Loader label="Crunching numbers…"/>}
    {res&&!load&&<div className="fade">
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:9}}><Logo t={tA} size={32}/><div><div style={{color:C.text,fontWeight:800}}>{tA.school}</div><div style={{color:C.muted,fontSize:11}}>{yA}</div></div></div>
          <div style={{display:"flex",alignItems:"center",gap:9}}><div style={{textAlign:"right"}}><div style={{color:C.text,fontWeight:800}}>{tB.school}</div><div style={{color:C.muted,fontSize:11}}>{yB}</div></div><Logo t={tB} size={32}/></div>
        </div>
        <div style={{height:26,background:C.border,borderRadius:13,overflow:"hidden",position:"relative",marginBottom:5}}>
          <div style={{position:"absolute",left:0,top:0,height:"100%",width:`${Math.round(res.pA*100)}%`,background:`linear-gradient(90deg,${C.green},${C.blue})`,transition:"width .5s ease"}}/>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:13,color:"#fff",textShadow:"0 1px 3px #0006"}}>{Math.round(res.pA*100)}% — {Math.round((1-res.pA)*100)}%</div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",color:C.dim,fontSize:10}}><span>Win probability</span><span>Win probability</span></div>
      </div>
      <div style={{display:"flex",gap:10,marginBottom:14,justifyContent:"center",alignItems:"center"}}>
        {[[res.sA,tA,yA],[null],[res.sB,tB,yB]].map((item,i)=>!item[0]?<div key="d" style={{color:C.dim,fontWeight:900,fontSize:18}}>–</div>:
          <div key={i} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 24px",textAlign:"center"}}><div style={{color:C.text,fontWeight:900,fontSize:34,fontFamily:"monospace"}}>{item[0]}</div><div style={{color:C.muted,fontSize:11,marginTop:3}}>{item[1].school} {item[2]}</div></div>)}
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 18px",marginBottom:10}}>
        <div style={{color:C.muted,fontWeight:800,fontSize:10,letterSpacing:1,marginBottom:7,textAlign:"center",textTransform:"uppercase"}}>SP+ Ratings</div>
        <SR lbl="Overall SP+" a={f1(res.spA.sp)} b={f1(res.spB.sp)}/><SR lbl="Offense" a={f1(res.spA.off)} b={f1(res.spB.off)}/><SR lbl="Defense (lower=better)" a={f1(res.spA.def)} b={f1(res.spB.def)} hb={false}/>
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 18px"}}>
        <div style={{color:C.muted,fontWeight:800,fontSize:10,letterSpacing:1,marginBottom:7,textAlign:"center",textTransform:"uppercase"}}>Roster</div>
        <SR lbl="Roster Size" a={res.rA.length} b={res.rB.length}/><SR lbl="Avg Stars" a={res.rA.length?f1(res.rA.reduce((s,p)=>s+(p.stars||0),0)/res.rA.length):"—"} b={res.rB.length?f1(res.rB.reduce((s,p)=>s+(p.stars||0),0)/res.rB.length):"—"}/><SR lbl="5★ Players" a={res.rA.filter(p=>p.stars===5).length} b={res.rB.filter(p=>p.stars===5).length}/>
      </div>
    </div>}
    {(hist||hLoad)&&tA&&tB&&<div style={{marginTop:26}}>
      <div style={{color:C.text,fontWeight:800,fontSize:15,marginBottom:12}}>📜 {tA.school} vs {tB.school} — History</div>
      {hLoad?<Loader label="Loading history…"/>:!hist?.length?<div style={{color:C.muted,textAlign:"center",padding:22}}>No recorded matchups found.</div>:
      <div style={{display:"flex",flexDirection:"column",gap:6}}>{hist.map((g,i)=>{
        const h=g.home_team===tA.school,aS=h?g.home_points:g.away_points,bS=h?g.away_points:g.home_points;
        return <div key={i} style={{display:"flex",alignItems:"center",gap:13,background:C.card,borderRadius:10,padding:"10px 16px",border:`1px solid ${C.border}`}}>
          <div style={{width:42,color:C.dim,fontSize:12,fontWeight:700,flexShrink:0}}>{g.season}</div>
          <div style={{flex:1,color:C.muted,fontSize:12}}>{g.week?`Week ${g.week}`:""}</div>
          <div style={{fontWeight:900,fontSize:14,fontFamily:"monospace",color:aS>bS?C.green:C.red}}>{aS} – {bS}</div>
          <div style={{color:aS>bS?C.green:C.red,fontWeight:800,fontSize:12,width:88,textAlign:"right"}}>{aS>bS?tA.school:tB.school} W</div>
        </div>;
      })}</div>}
    </div>}
  </div>;
}

// ── TEAM VIEW ─────────────────────────────────────────────────────────────────
function TeamView({team}){
  const[tab,sT]=useState("depth");
  const[roster,sRo]=useState(null);const[commits,sCo]=useState(null);
  const[games,sGa]=useState(null);const[ratings,sRa]=useState(null);
  const[load,sL]=useState(false);
  useEffect(()=>{
    if(!team)return;
    sRo(null);sCo(null);sGa(null);sRa(null);sL(true);
    Promise.all([
      api("/roster",{team:team.school,year:DATA_YEAR}),
      api("/recruiting/players",{team:team.school,year:DATA_YEAR+1}),
      api("/games",{team:team.school,year:DATA_YEAR,seasonType:"regular"}),
      api("/ratings/sp",{year:DATA_YEAR}),
    ]).then(([r,c,g,sp])=>{
      sRo(r||[]);sCo(c||[]);sGa(g||[]);
      if(sp){const m={};sp.forEach(t=>{m[t.team]=(t.offense?.rating||0)+(t.defense?.rating||0);});sRa(m);}
      sL(false);
    });
  },[team]);
  return <div>
    <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:20}}><Logo t={team} size={52}/><div><h2 style={{color:C.text,margin:0,fontSize:24,fontWeight:900}}>{team.school}</h2><div style={{color:C.muted,fontSize:13}}>{team.conf} · {team.city}, {team.state}</div></div></div>
    <Tabs tabs={[{id:"depth",icon:"📋",label:"Depth Chart"},{id:"schedule",icon:"📅",label:"Schedule"},{id:"recruiting",icon:"🎯",label:"Recruiting"}]} active={tab} set={sT}/>
    {load?<Loader label={`Loading ${team.school}…`}/>:<>
      {tab==="depth"&&<DepthChart roster={roster} commits={commits}/>}
      {tab==="schedule"&&<Schedule games={games} team={team.school} ratings={ratings}/>}
      {tab==="recruiting"&&<Recruiting commits={commits}/>}
    </>}
  </div>;
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const[sel,sSel]=useState(null);
  const[q,sQ]=useState("");const[conf,sC]=useState("All");
  const[gTab,sGT]=useState("teams");
  const confs=["All",...Array.from(new Set(TEAMS.map(t=>t.conf))).sort()];
  const list=TEAMS.filter(t=>t.school.toLowerCase().includes(q.toLowerCase())&&(conf==="All"||t.conf===conf));
  const NAV=[{id:"teams",icon:"🏈",label:"Teams"},{id:"portal",icon:"🔄",label:"Portal"},{id:"matchup",icon:"⚔️",label:"Matchup"}];
  return <div style={{minHeight:"100vh",background:C.bg,color:C.text,display:"flex",flexDirection:"column"}}>
    <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"0 18px",display:"flex",alignItems:"center",gap:12,height:52,flexShrink:0}}>
      <span style={{fontSize:20}}>🏈</span>
      <span style={{fontWeight:900,fontSize:16,color:C.text}}>GridIron</span><span style={{fontWeight:300,fontSize:16,color:C.accent}}>Scout</span>
      <div style={{flex:1}}/>
      <div style={{display:"flex",gap:3}}>{NAV.map(t=><button key={t.id} onClick={()=>sGT(t.id)} style={{background:gTab===t.id?C.accentA:"none",border:`1px solid ${gTab===t.id?C.accent+"55":"transparent"}`,borderRadius:7,padding:"5px 12px",cursor:"pointer",fontWeight:700,fontSize:13,color:gTab===t.id?C.accent:C.muted,display:"flex",alignItems:"center",gap:4}}><span>{t.icon}</span><span>{t.label}</span></button>)}</div>
    </div>
    <div style={{display:"flex",flex:1,overflow:"hidden"}}>
      {gTab==="teams"&&<div style={{width:256,flexShrink:0,background:C.surface,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:11,borderBottom:`1px solid ${C.border}`}}>
          <input value={q} onChange={e=>sQ(e.target.value)} placeholder="Search teams…" style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 11px",color:C.text,fontSize:13,outline:"none",marginBottom:7}}/>
          <select value={conf} onChange={e=>sC(e.target.value)} style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 11px",color:C.text,fontSize:12,outline:"none"}}>{confs.map(c=><option key={c} value={c}>{c}</option>)}</select>
        </div>
        <div style={{flex:1,overflowY:"auto"}}>{list.map(t=><div key={t.id} onClick={()=>sSel(t)} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 12px",cursor:"pointer",background:sel?.id===t.id?C.card:"transparent",borderLeft:`3px solid ${sel?.id===t.id?C.accent:"transparent"}`,borderBottom:`1px solid ${C.border}14`}}><Logo t={t} size={26}/><div><div style={{color:C.text,fontWeight:600,fontSize:13}}>{t.school}</div><div style={{color:C.dim,fontSize:10}}>{t.conf}</div></div></div>)}</div>
        <div style={{padding:"7px 12px",borderTop:`1px solid ${C.border}`,color:C.dim,fontSize:11,display:"flex",justifyContent:"space-between"}}><span>{list.length} teams</span><a href="https://collegefootballdata.com" target="_blank" style={{color:C.accent}}>CFBD</a></div>
      </div>}
      <div style={{flex:1,overflowY:"auto",padding:24}}>
        {gTab==="teams"&&(!sel?<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"70%",gap:12}}>
          <div style={{fontSize:54}}>🏈</div>
          <h2 style={{color:C.text,margin:0,fontWeight:900,fontSize:26}}>GridIronScout</h2>
          <p style={{color:C.muted,textAlign:"center",maxWidth:380,lineHeight:1.7,margin:0,fontSize:14}}>Select any team from the sidebar to view live depth charts, schedules, and recruiting data.</p>
          <div style={{display:"flex",gap:9,marginTop:8,flexWrap:"wrap",justifyContent:"center"}}>{[["📋","Depth Charts"],["🎯","Recruiting"],["🔄","Portal"],["⚔️","Matchups"]].map(([icon,l])=><div key={l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:9,padding:"11px 16px",textAlign:"center",minWidth:86}}><div style={{fontSize:20,marginBottom:3}}>{icon}</div><div style={{color:C.muted,fontSize:12,fontWeight:600}}>{l}</div></div>)}</div>
        </div>:<TeamView team={sel}/>)}
        {gTab==="portal"&&<Portal/>}
        {gTab==="matchup"&&<Matchup/>}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
