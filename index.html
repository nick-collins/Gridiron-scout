// Direct CFBD fetch — key stored only in browser sessionStorage, never sent to a server
let CFBD_KEY = sessionStorage.getItem("cfbd_key") || "";

async function api(path, params={}) {
  if (!CFBD_KEY) return null;
  const url = new URL("https://api.collegefootballdata.com" + path);
  Object.entries(params).forEach(([k,v])=>{ if(v!=null&&v!=="") url.searchParams.set(k,String(v)); });
  try {
    const r = await fetch(url.toString(), { headers:{ Authorization:`Bearer ${CFBD_KEY}`, Accept:"application/json" } });
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

function TSearch({val,set,exclude=""}){
  const[q,sQ]=useState("");const[open,sO]=useState(false);const ref=useRef();
  const list=TEAMS.filter(t=>t.s.toLowerCase().includes(q.toLowerCase())&&t.s!==exclude).slice(0,18);
  useEffect(()=>{const fn=e=>{if(ref.current&&!ref.current.contains(e.target))sO(false)};document.addEventListener("mousedown",fn);return()=>document.removeEventListener("mousedown",fn);},[]);

// ── DEPTH CHART ───────────────────────────────────────────────────────────────
function DepthChart({roster,commits}){
  const[grp,sG]=useState("Offense");
  const all=[...(roster||[]).map(p=>({...p,_c:false})),...(commits||[]).map(p=>({...p,_c:true,year:1}))];
  const pos=POS[grp]||[];
  const byPos={};
  all.forEach(p=>{const k=p.position?.toUpperCase();if(pos.includes(k))(byPos[k]=byPos[k]||[]).push(p);});
  Object.keys(byPos).forEach(k=>byPos[k].sort((a,b)=>pScore(b)-pScore(a)));
  const filled=pos.filter(k=>byPos[k]?.length>0);
  return <div>
    <div style={{display:"flex",gap:7,marginBottom:18,flexWrap:"wrap"}}>{Object.keys(POS).map(g=><Pill key={g} label={g} on={grp===g} click={()=>sG(g)}/>)}</div>
    {filled.length===0?<div style={{color:C.muted,textAlign:"center",padding:48}}>No players found for this group.</div>:
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:12}}>
      {filled.map(pos=><div key={pos} style={{background:C.card,borderRadius:10,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        <div style={{background:C.border,padding:"6px 13px",fontWeight:900,fontSize:11,color:C.accent,letterSpacing:2}}>{pos}</div>
        {byPos[pos].slice(0,4).map((p,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:9,padding:"10px 13px",borderBottom:i<3?`1px solid ${C.border}`:"none",opacity:i===0?1:.72}}>
          <div style={{width:22,height:22,borderRadius:"50%",background:i===0?C.accent:C.border,color:i===0?"#000":C.muted,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:10,flexShrink:0}}>{i+1}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{color:C.text,fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
              {p.first_name||""} {p.last_name||p.name||""}
              {p._c&&<span style={{marginLeft:5,fontSize:9,background:"#22c55e22",color:C.green,borderRadius:4,padding:"1px 4px",fontWeight:700}}>COMMIT</span>}
            </div>
            <div style={{color:C.muted,fontSize:11}}>{["Fr","So","Jr","Sr","Gr"][clamp((p.year||1)-1,0,4)]}{p.stars?` · ${"★".repeat(p.stars)}`:""}</div>
          </div>
          <div style={{color:C.accent,fontWeight:800,fontSize:11,fontFamily:"monospace"}}>{pScore(p)}</div>
        </div>)}
      </div>)}
    </div>}
  </div>;
}

    if(!games?.length||!ratings)return null;
    let w=0,l=0;
    games.forEach(g=>{const h=g.home_team===team,opp=h?g.away_team:g.home_team;const p=h?winP(ratings[team]||0,ratings[opp]||0):1-winP(ratings[opp]||0,ratings[team]||0);w+=p;l+=1-p;});
    return{w:f1(w),l:f1(l),n:games.length};
  })();
  if(!games?.length)return <div style={{color:C.muted,textAlign:"center",padding:48}}>No schedule data.</div>;
  return <div>
    {rec&&<div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap"}}><Badge label="Proj Wins" val={rec.w} color={C.green}/><Badge label="Proj Losses" val={rec.l} color={C.red}/><Badge label="Games" val={rec.n} color={C.blue}/></div>}
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {games.map((g,i)=>{
        const h=g.home_team===team,opp=h?g.away_team:g.home_team;
        const p=h?winP(ratings?.[team]||0,ratings?.[opp]||0):1-winP(ratings?.[opp]||0,ratings?.[team]||0);
        const pct=Math.round(p*100),done=g.home_points!=null;
        const won=done&&(h?g.home_points>g.away_points:g.away_points>g.home_points);
        return <div key={i} style={{display:"flex",alignItems:"center",gap:13,background:C.card,borderRadius:10,padding:"11px 16px",border:`1px solid ${C.border}`}}>
          <div style={{width:36,color:C.dim,fontSize:11,textAlign:"center",flexShrink:0}}>{g.week?`Wk ${g.week}`:`#${i+1}`}</div>
          <div style={{flex:1}}><span style={{color:C.muted,fontSize:11,marginRight:5}}>{h?"vs":"@"}</span><span style={{color:C.text,fontWeight:700,fontSize:14}}>{opp}</span></div>
          {done?<span style={{color:won?C.green:C.red,fontWeight:800,fontSize:13}}>{won?"W":"L"} {h?`${g.home_points}-${g.away_points}`:`${g.away_points}-${g.home_points}`}</span>
          :<div style={{display:"flex",alignItems:"center",gap:7}}><div style={{width:76,height:6,background:C.border,borderRadius:3,overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:pct>60?C.green:pct<40?C.red:C.accent,borderRadius:3}}/></div><span style={{color:C.muted,fontSize:12,width:34,textAlign:"right"}}>{pct}%</span></div>}
        </div>;
      })}
    </div>
  </div>;
}

// ── MATCHUP ───────────────────────────────────────────────────────────────────
function Matchup(){
  const[tA,sTA]=useState(null);const[tB,sTB]=useState(null);
  const[yA,sYA]=useState(String(DATA_YEAR));const[yB,sYB]=useState(String(DATA_YEAR));
  const[neutral,sN]=useState(false);const[res,sR]=useState(null);const[load,sL]=useState(false);
  const[hist,sH]=useState(null);const[hLoad,sHL]=useState(false);
  const YRS=Array.from({length:6},(_,i)=>DATA_YEAR-i);
  async function run(){
    if(!tA||!tB)return;sL(true);sR(null);sH(null);
    const[sp,rA,rB]=await Promise.all([api("/ratings/sp",{year:Math.max(Number(yA),Number(yB))}),api("/roster",{team:tA.s,year:yA}),api("/roster",{team:tB.s,year:yB})]);
    const m={};(sp||[]).forEach(t=>{m[t.team]={off:t.offense?.rating||0,def:t.defense?.rating||0,sp:(t.offense?.rating||0)+(t.defense?.rating||0)};});
    const spA=m[tA.s]||{off:0,def:0,sp:0},spB=m[tB.s]||{off:0,def:0,sp:0};
    const diff=(spA.sp+(neutral?0:2.5))-spB.sp,pA=1/(1+Math.exp(-diff/7));
    sR({spA,spB,pA,sA:Math.max(7,Math.round(14+spA.off*.4-spB.def*.3)),sB:Math.max(7,Math.round(14+spB.off*.4-spA.def*.3)),rA:rA||[],rB:rB||[]});
    sL(false);sHL(true);
    const g=await api("/games",{team:tA.s,opponent:tB.s});
    sH((g||[]).sort((a,b)=>b.season-a.season).slice(0,10));sHL(false);
  }
  const SR=({lbl,a,b,hb=true})=>{
    const an=parseFloat(a),bn=parseFloat(b),aW=!isNaN(an)&&!isNaN(bn)&&(hb?an>bn:an<bn),bW=!isNaN(an)&&!isNaN(bn)&&(hb?bn>an:bn<an);
    return <div style={{display:"flex",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}18`}}>
      <div style={{flex:1,textAlign:"right",fontWeight:aW?800:400,color:aW?C.green:C.text,fontSize:13}}>{a??"-"}</div>
      <div style={{width:170,textAlign:"center",color:C.muted,fontSize:11,textTransform:"uppercase",letterSpacing:.7,padding:"0 10px"}}>{lbl}</div>
      <div style={{flex:1,textAlign:"left",fontWeight:bW?800:400,color:bW?C.green:C.text,fontSize:13}}>{b??"-"}</div>
    </div>;
  };
  return <div>
    <h3 style={{margin:"0 0 18px",color:C.text,fontWeight:900,fontSize:20}}>⚔️ Matchup Simulator</h3>
    <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:14,alignItems:"center",marginBottom:18}}>
      <div style={{display:"flex",flexDirection:"column",gap:7}}><TSearch val={tA} set={sTA} exclude={tB?.s}/><select value={yA} onChange={e=>sYA(e.target.value)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 11px",color:C.text,fontSize:13,outline:"none"}}>{YRS.map(y=><option key={y} value={y}>{y}</option>)}</select></div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}><div style={{color:C.accent,fontWeight:900,fontSize:22}}>VS</div><label style={{display:"flex",alignItems:"center",gap:5,color:C.muted,fontSize:12,cursor:"pointer"}}><input type="checkbox" checked={neutral} onChange={e=>sN(e.target.checked)}/> Neutral</label></div>
      <div style={{display:"flex",flexDirection:"column",gap:7}}><TSearch val={tB} set={sTB} exclude={tA?.s}/><select value={yB} onChange={e=>sYB(e.target.value)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 11px",color:C.text,fontSize:13,outline:"none"}}>{YRS.map(y=><option key={y} value={y}>{y}</option>)}</select></div>
    </div>
    <button onClick={run} disabled={!tA||!tB||load} style={{width:"100%",background:C.accent,color:"#000",border:"none",borderRadius:10,padding:12,fontWeight:900,fontSize:15,cursor:tA&&tB?"pointer":"not-allowed",opacity:tA&&tB?1:.45,marginBottom:22}}>{load?"Simulating…":"⚡ Run Simulation"}</button>
    {load&&<Loader label="Crunching numbers…"/>}
    {res&&!load&&<div className="fade">
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:9}}><Logo t={tA} size={32}/><div><div style={{color:C.text,fontWeight:800}}>{tA.s}</div><div style={{color:C.muted,fontSize:11}}>{yA}</div></div></div>
          <div style={{display:"flex",alignItems:"center",gap:9}}><div style={{textAlign:"right"}}><div style={{color:C.text,fontWeight:800}}>{tB.s}</div><div style={{color:C.muted,fontSize:11}}>{yB}</div></div><Logo t={tB} size={32}/></div>
        </div>
        <div style={{height:26,background:C.border,borderRadius:13,overflow:"hidden",position:"relative",marginBottom:5}}>
          <div style={{position:"absolute",left:0,top:0,height:"100%",width:`${Math.round(res.pA*100)}%`,background:`linear-gradient(90deg,${C.green},${C.blue})`,transition:"width .5s ease"}}/>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:13,color:"#fff",textShadow:"0 1px 3px #0006"}}>{Math.round(res.pA*100)}% — {Math.round((1-res.pA)*100)}%</div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",color:C.dim,fontSize:10}}><span>Win probability</span><span>Win probability</span></div>
      </div>
      <div style={{display:"flex",gap:10,marginBottom:14,justifyContent:"center",alignItems:"center"}}>
        {[[res.sA,tA,yA],[null],[res.sB,tB,yB]].map((item,i)=>!item[0]?<div key="d" style={{color:C.dim,fontWeight:900,fontSize:18}}>–</div>:<div key={i} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 24px",textAlign:"center"}}><div style={{color:C.text,fontWeight:900,fontSize:34,fontFamily:"monospace"}}>{item[0]}</div><div style={{color:C.muted,fontSize:11,marginTop:3}}>{item[1].s} {item[2]}</div></div>)}
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 18px",marginBottom:10}}><div style={{color:C.muted,fontWeight:800,fontSize:10,letterSpacing:1,marginBottom:7,textAlign:"center",textTransform:"uppercase"}}>SP+ Ratings</div><SR lbl="Overall SP+" a={f1(res.spA.sp)} b={f1(res.spB.sp)}/><SR lbl="Offense" a={f1(res.spA.off)} b={f1(res.spB.off)}/><SR lbl="Defense (lower=better)" a={f1(res.spA.def)} b={f1(res.spB.def)} hb={false}/></div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 18px"}}><div style={{color:C.muted,fontWeight:800,fontSize:10,letterSpacing:1,marginBottom:7,textAlign:"center",textTransform:"uppercase"}}>Roster</div><SR lbl="Roster Size" a={res.rA.length} b={res.rB.length}/><SR lbl="Avg Stars" a={res.rA.length?f1(res.rA.reduce((s,p)=>s+(p.stars||0),0)/res.rA.length):"—"} b={res.rB.length?f1(res.rB.reduce((s,p)=>s+(p.stars||0),0)/res.rB.length):"—"}/><SR lbl="5★ Players" a={res.rA.filter(p=>p.stars===5).length} b={res.rB.filter(p=>p.stars===5).length}/></div>
    </div>}
    {(hist||hLoad)&&tA&&tB&&<div style={{marginTop:26}}>
      <div style={{color:C.text,fontWeight:800,fontSize:15,marginBottom:12}}>📜 {tA.s} vs {tB.s} — History</div>
      {hLoad?<Loader label="Loading history…"/>:!hist?.length?<div style={{color:C.muted,textAlign:"center",padding:22}}>No recorded matchups found.</div>:
      <div style={{display:"flex",flexDirection:"column",gap:6}}>{hist.map((g,i)=>{
        const h=g.home_team===tA.s,aS=h?g.home_points:g.away_points,bS=h?g.away_points:g.home_points;
        return <div key={i} style={{display:"flex",alignItems:"center",gap:13,background:C.card,borderRadius:10,padding:"10px 16px",border:`1px solid ${C.border}`}}>
          <div style={{width:42,color:C.dim,fontSize:12,fontWeight:700,flexShrink:0}}>{g.season}</div>
          <div style={{flex:1,color:C.muted,fontSize:12}}>{g.week?`Week ${g.week}`:""}</div>
          <div style={{fontWeight:900,fontSize:14,fontFamily:"monospace",color:aS>bS?C.green:C.red}}>{aS} – {bS}</div>
          <div style={{color:aS>bS?C.green:C.red,fontWeight:800,fontSize:12,width:88,textAlign:"right"}}>{aS>bS?tA.s:tB.s} W</div>
        </div>;
      })}</div>}
    </div>}
  </div>;
}

          <select value={conf} onChange={e=>sC(e.target.value)} style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 11px",color:C.text,fontSize:12,outline:"none"}}>{confs.map(c=><option key={c} value={c}>{c}</option>)}</select>
        </div>
        <div style={{flex:1,overflowY:"auto"}}>{list.map(t=><div key={t.id} onClick={()=>sSel(t)} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 12px",cursor:"pointer",background:sel?.id===t.id?C.card:"transparent",borderLeft:`3px solid ${sel?.id===t.id?C.accent:"transparent"}`,borderBottom:`1px solid ${C.border}14`}}><Logo t={t} size={26}/><div><div style={{color:C.text,fontWeight:600,fontSize:13}}>{t.s}</div><div style={{color:C.dim,fontSize:10}}>{t.c}</div></div></div>)}</div>
        <div style={{padding:"7px 12px",borderTop:`1px solid ${C.border}`,color:C.dim,fontSize:11,display:"flex",justifyContent:"space-between"}}><span>{list.length} teams</span><a href="https://collegefootballdata.com" target="_blank" style={{color:C.accent}}>CFBD</a></div>
      </div>}
      <div style={{flex:1,overflowY:"auto",padding:24}}>
        <KeyBanner hasKey={hasKey} setKey={setKey}/>
        {gTab==="teams"&&(!sel?<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"60%",gap:12}}>
          <div style={{fontSize:54}}>🏈</div>
          <h2 style={{color:C.text,margin:0,fontWeight:900,fontSize:26}}>GridIronScout</h2>
          <p style={{color:C.muted,textAlign:"center",maxWidth:380,lineHeight:1.7,margin:0,fontSize:14}}>Select a team from the sidebar. Enter your free CFBD key above to load live rosters, schedules &amp; recruiting.</p>
        </div>:<TeamView team={sel}/>)}
        {gTab==="portal"&&<Portal/>}
        {gTab==="matchup"&&<Matchup/>}
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
